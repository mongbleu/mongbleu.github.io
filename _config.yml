# Welcome to Jekyll!
#
# This config file is meant for settings that affect your entire site, values
# which you are expected to set up once and rarely need to edit after that.
# For technical reasons, this file is *NOT* reloaded automatically when you use
# `jekyll serve -l -H localhost`. If you change this file, please restart the 
# server process.

# Basic Site Settings
locale                   : "en-US"
site_theme               : "air" # The available themes options are "default", "air", "sunrise", "mint", "dirt" and "contrast"
title                    : "Yujeong Jeong"
title_separator          : "-"
name                     : &name "Yujeong Jeong"
description              : &description "Knowledge-guided AI for environmental modeling — differentiable hybrid models, GHG spatial modeling, and climate technology cooperation analysis. Models, code, and data by Yujeong Jeong."
url                      : https://mongbleu.github.io # The base hostname & protocol for your site
baseurl                  : "" # the subpath of your site, e.g. "/blog" — must stay empty for a user site
repository               : "mongbleu/mongbleu.github.io"

# Site Author - The following control what appear as part of the author content on the side bar.
#               If a field is blank the icon and link will not appear, otherwise it will be shown.
#               Additional customization can be done by editing /_includes/author-profile.html
# NOTE: YAML takes the LAST value when a key appears twice. Each key below appears
#       exactly once — do not re-add the duplicate blocks that shipped with the template.
#       Format matters: github / linkedin / bluesky take a USERNAME (the template builds
#       the URL), while googlescholar / orcid / researchgate take a FULL URL.
author:
  avatar           : "profile.png"
  name             : "Yujeong Jeong"
  pronouns         :
  bio              : "Knowledge-guided AI for environmental modeling · GHG spatial modeling · Climate technology cooperation"
  location         : "Seoul, Republic of Korea"
  employer         : "National Institute of Green Technology"
  uri              :
  email            : "deepbluelearning98@gmail.com"        # personal — stays valid after leaving NIGT
  email_work       : "bluelearning@nigt.re.kr"             # institutional (custom field, see _includes/author-profile.html)
  email_work_label : "NIGT email"

  # Academic profiles (FULL URLs)
  academia         :
  arxiv            :
  googlescholar    : "https://scholar.google.com/citations?hl=en&user=KSyS2SoAAAAJ"
  inspire-hep      :
  impactstory      :
  orcid            : "https://orcid.org/0009-0001-4462-0266"
  semantic         :
  ssrn             :
  pubmed           :
  researchgate     : "https://www.researchgate.net/profile/Yujeong-Jeong-8/research"
  scopus           :
  zotero           :

  # Repositories and software development (USERNAMES)
  bitbucket        :
  codepen          :
  dribbble         :
  github           : "mongbleu"
  kaggle           :
  stackoverflow    :

  # Social media (USERNAMES unless noted)
  artstation       :
  bluesky          :
  facebook         :
  flickr           :
  foursquare       :
  goodreads        :
  google_plus      :
  keybase          :
  instagram        :
  lastfm           :
  linkedin         : "yujeong-jeong-b81699294"
  mastodon         : # URL
  medium           : # URL
  pinterest        :
  soundcloud       :
  steam            :
  telegram         : # URL
  tumblr           :
  twitter          :
  vine             :
  weibo            :
  wikipedia        :
  xing             :
  youtube          :
  zhihu            :

# Publication Category - headings on /publications/, rendered in the order listed here.
# Each _publications/*.md file selects one of these keys via its `category:` field.
publication_category:
  manuscripts:
    title: 'Peer-reviewed Journal Articles'
  underreview:
    title: 'Manuscripts Under Review'
  inprep:
    title: 'Manuscripts in Preparation'
  conferences:
    title: 'Conference Presentations'
  patents:
    title: 'Patents'
  reports:
    title: 'Policy Briefs &amp; Reports'

# Site Settings
teaser                   :  # filename of teaser fallback teaser image placed in /images/ for social media previews
breadcrumbs              : false # true, false (default)
words_per_minute         : 160
future                   : true
read_more                : "disabled" # if enabled, adds "Read more" links to excerpts
talkmap_link             : false      #change to true to add link to talkmap on talks page
comments:
  provider               : # false (default), "disqus", "discourse", "facebook", "google-plus", "staticman", "custom"
  disqus:
    shortname            :
  discourse:
    server               : # https://meta.discourse.org/t/embedding-discourse-comments-via-javascript/31963 , e.g.: meta.discourse.org
  facebook:
    appid                :
    num_posts            : # 5 (default)
    colorscheme          : # "light" (default), "dark"
staticman:
  allowedFields          : ['name', 'email', 'url', 'message']
  branch                 : "gh-pages" # "master", "gh-pages"
  commitMessage          : "New comment."
  filename               : comment-{@timestamp}
  format                 : "yml"
  moderation             : true
  path                   : "_data/comments/{options.slug}"
  requiredFields         : ['name', 'email', 'message']
  transforms:
    email                : "md5"
  generatedFields:
    date:
      type               : "date"
      options:
        format           : "iso8601" # "iso8601" (default), "timestamp-seconds", "timestamp-milliseconds"
atom_feed:
  hide                   : false     # change to true to hide the RSS feed in the footer
  path                   : # blank (default) uses feed.xml


# SEO Related
google_site_verification :
bing_site_verification   :
alexa_site_verification  :
yandex_site_verification :


# Social Sharing
twitter:
  username               : &twitter
facebook:
  username               :
  app_id                 :
  publisher              :
og_image                 : "/images/profile.png"  # link preview image when the URL is pasted into email/Slack
og_description           : *description
# For specifying social profiles
# - https://developers.google.com/structured-data/customize/social-profiles
social:
  type                   : # Person or Organization (defaults to Person)
  name                   : # If the user or organization name differs from the site's name
  links: # An array of links to social media profiles


# Analytics
analytics:
  provider               : false # false (default), "google", "google-universal", "google-analytics-4", "custom"
  google:
    tracking_id          :


# Reading Files
include:
  - .htaccess
  - _pages
  - files
exclude:
  - "*.sublime-project"
  - "*.sublime-workspace"
  - .asset-cache
  - .bundle
  - .github
  - .jekyll-assets-cache
  - .sass-cache
  - assets/js/_main.js
  - assets/js/plugins
  - assets/js/vendor
  - CHANGELOG
  - Capfile
  - config
  - Dockerfile
  - Gemfile
  - Gruntfile.js
  - gulpfile.js
  - LICENSE
  - local
  - log
  - node_modules
  - package.json*
  - Rakefile
  - README
  - tmp
  - vendor
keep_files:
  - .git
  - .svn
encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"


# Conversion
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false


# Markdown Processing
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false


# These settings control the types of collections used by the template
collections:
  publications:
    output: true
    permalink: /:collection/:path/
  # Models & data — each entry is one model/dataset/platform with its own documentation page.
  # This is the collection that merges the "personal site" and the "model docs site".
  models:
    output: true
    permalink: /models/:path/
  # Kept defined but currently unused (no files, not in the nav). Re-enable by adding
  # files to _talks/ or _teaching/ and restoring the nav entry in _data/navigation.yml.
  talks:
    output: true
    permalink: /:collection/:path/
  teaching:
    output: true
    permalink: /:collection/:path/


# These settings control how pages and collections are included in the site
defaults:
  # _posts
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: true
      share: true
      related: true
  # _pages
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true
  # _teaching
  - scope:
      path: ""
      type: teaching
    values:
      layout: single
      author_profile: true
      share: true
      comments: true
  # _publications
  - scope:
      path: ""
      type: publications
    values:
      layout: single
      author_profile: true
      share: true
      comments: true
  # _models
  - scope:
      path: ""
      type: models
    values:
      layout: single
      author_profile: true
      share: true
      comments: false
  # _talks
  - scope:
      path: ""
      type: talks
    values:
      layout: talk
      author_profile: true
      share: true


# Sass/SCSS
sass:
  sass_dir: _sass
  style: compressed # https://sass-lang.com/documentation/file.SASS_REFERENCE.html#output_style


# Outputting
permalink: /:categories/:title/
# paginate: 5 # amount of posts to show
# paginate_path: /page:num/
timezone: Asia/Seoul # https://en.wikipedia.org/wiki/List_of_tz_database_time_zones


# Plugins
plugins:
  - jekyll-feed
  - jekyll-gist
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji

# Mimic GitHub Pages with --safe
whitelist:
  - jekyll-feed
  - jekyll-gist
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji


# Archives
#  Type
#  - GitHub Pages compatible archive pages built with Liquid ~> type: liquid (default)
#  - Jekyll Archives plugin archive pages ~> type: jekyll-archives
#  Path (examples)
#  - Archive page should exist at path when using Liquid method or you can
#    expect broken links (especially with breadcrumbs enabled)
#  - <base_path>/tags/my-awesome-tag/index.html ~> path: /tags/
#  - <base_path/categories/my-awesome-category/index.html ~> path: /categories/
#  - <base_path/my-awesome-category/index.html ~> path: /
category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/
# https://github.com/jekyll/jekyll-archives
# jekyll-archives:
#   enabled:
#     - categories
#     - tags
#   layouts:
#     category: archive-taxonomy
#     tag: archive-taxonomy
#   permalinks:
#     category: /categories/:name/
#     tag: /tags/:name/


# HTML Compression
# - https://jch.penibelst.de/
compress_html:
  clippings: all
  ignore:
    envs: development
